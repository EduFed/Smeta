<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Смета — СМЕТА | РАСЧЁТ</title>

<!-- Страницу заказчика поисковикам отдавать не надо: за каждой ссылкой
     стоят чужие деньги и чужой объект. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="icon-192.png">
<link href="https://api.smetaraschet.ru/static/fonts.css" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://api.smetaraschet.ru/static/fonts.css" rel="stylesheet"></noscript>

<style>
  /* Вид взят из приложения: те же цвета, та же строка позиции.
     Правило «одинаковое по смыслу — одинаково и на вид» относится
     и к странице заказчика — он в тот же день может увидеть и её,
     и присланный PDF. */
  :root{
    --paper:#F6F3EC; --paper-line:#D9D2BE; --ink:#1E2A32; --ink-soft:#5B6B74;
    --white:#FFFDF9; --orange:#E8622C; --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#191C1F; --paper-line:#333A40; --ink:#E8E6E1;
           --ink-soft:#9AA5AC; --white:#111417; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0 16px 48px;
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.5;
  }
  .obertka{max-width:820px;margin:0 auto;}
  header{padding:28px 0 18px;}
  h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:26px;margin:0 0 4px;line-height:1.2;}
  .podpis{color:var(--ink-soft);font-size:13px;}
  h2{font-family:'Space Grotesk','Inter',sans-serif;font-size:18px;margin:28px 0 10px;}
  .gruppa{margin-bottom:18px;}
  .gruppa-shapka{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--paper-line);
    font-size:12px;font-weight:600;color:var(--ink-soft);
  }
  .stroka{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 10px;margin-bottom:6px;
    border:1px solid var(--paper-line);border-radius:var(--radius);
    background:var(--paper);font-size:13px;
  }
  .nazv{flex:1 1 180px;min-width:0;}
  .chislo{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);
    white-space:nowrap;}
  .summa{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);white-space:nowrap;}
  .itogi{margin-top:18px;padding-top:12px;border-top:1px solid var(--paper-line);
    display:flex;flex-direction:column;gap:6px;max-width:440px;}
  .itog{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    font-size:14px;color:var(--ink-soft);}
  .itog b{font-family:'JetBrains Mono',monospace;color:var(--ink);}
  .itog-glavnyy{font-weight:600;color:var(--ink);font-size:15px;}
  .itog-glavnyy b{color:var(--orange);font-size:18px;}
  .karta{border:1px solid var(--paper-line);border-radius:var(--radius);
    background:var(--white);padding:14px 16px;margin-bottom:14px;}
  .karta div{margin:2px 0;}
  .zametka{color:var(--ink-soft);font-size:13px;line-height:1.55;}
  .beda{
    max-width:520px;margin:64px auto;padding:22px 24px;text-align:center;
    border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--white);
  }
  .beda h1{font-size:20px;margin-bottom:8px;}
  .podval{margin-top:36px;padding-top:16px;border-top:1px solid var(--paper-line);
    color:var(--ink-soft);font-size:12px;line-height:1.6;}
</style>
</head>
<body>
<div class="obertka" id="koren">
  <div class="zametka" style="padding:64px 0;text-align:center;">Открываем смету…</div>
</div>

<script>
// ---------- СТРАНИЦА ЗАКАЗЧИКА ----------
//
// Открывается по ссылке, без входа. Ничего не считает: смета приходит
// СНИМКОМ, посчитанным приложением той же арифметикой, которой печатается
// PDF. Второго способа считать деньги здесь нет и быть не должно —
// иначе он однажды разойдётся с первым, и разойдётся в деньгах.
//
// Ключ ниже публичный: он и так лежит в открытом index.html. Сам по себе
// он не даёт ничего — всё решает токен ссылки.
const ADRES = 'https://api.smetaraschet.ru';
const KLYUCH = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0NDU4MzIyLCJleHAiOjIwOTk4MTgzMjJ9.YyClmZI9ZYHS6Tw7N5-WaxqcrEskgHTb2v5hM9MyO0Q';

function ekran(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function dengi(v){
  const n = Number(v) || 0;
  return n.toLocaleString('ru-RU', { maximumFractionDigits:0 }) + ' ₽';
}
function chislo(v){
  const n = Number(v);
  if(!isFinite(n)) return '';
  return n.toLocaleString('ru-RU', { maximumFractionDigits:3 });
}
function data(v){
  if(!v) return '';
  const d = new Date(v);
  return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
}

function beda(zagolovok, poyasnenie){
  document.getElementById('koren').innerHTML =
    '<div class="beda"><h1>' + ekran(zagolovok) + '</h1>' +
    '<div class="zametka">' + ekran(poyasnenie) + '</div></div>';
}

async function otkryt(){
  const token = new URLSearchParams(location.search).get('s');
  if(!token){
    beda('Ссылка неполная', 'Похоже, адрес скопирован не целиком. Попросите прислать ссылку заново.');
    return;
  }
  let otvet;
  try{
    const r = await fetch(ADRES + '/rest/v1/rpc/share_payload', {
      method:'POST',
      headers:{ 'apikey':KLYUCH, 'Authorization':'Bearer ' + KLYUCH,
                'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if(!r.ok) throw new Error('код ' + r.status);
    otvet = await r.json();
  }catch(e){
    console.error(e);
    beda('Не удалось открыть', 'Проверьте связь и обновите страницу. Если не поможет — попросите прислать ссылку заново.');
    return;
  }
  if(!otvet || !otvet.ok){
    beda('Ссылка не работает', (otvet && otvet.error) || 'Возможно, срок вышел или её отозвали.');
    return;
  }
  narisovat(otvet);
}

function narisovat(d){
  const p = d.project || {};
  const sn = d.estimate || {};
  const ch = [];

  ch.push('<header><h1>' + ekran(p.name || 'Смета') + '</h1>' +
    '<div class="podpis">' + (sn.sozdan ? 'смета от ' + ekran(data(sn.sozdan)) : '') + '</div></header>');

  // ----- заказчик, если разрешено -----
  const c = d.customer;
  if(c){
    const stroki = [];
    if(c.fio)     stroki.push(ekran(c.fio));
    if(c.address) stroki.push(ekran(c.address));
    if(c.phone)   stroki.push(ekran(c.phone));
    if(c.email)   stroki.push(ekran(c.email));
    if(c.contract_no) stroki.push('Договор № ' + ekran(c.contract_no) +
      (c.contract_date ? ' от ' + ekran(data(c.contract_date)) : ''));
    if(stroki.length) ch.push('<div class="karta">' + stroki.map(x=>'<div>'+x+'</div>').join('') + '</div>');
  }

  // ----- смета -----
  const gruppy = sn.gruppy || [];
  if(gruppy.length){
    ch.push('<h2>Смета</h2>');
    gruppy.forEach(g=>{
      const summa = (g.stroki||[]).reduce((a,i)=> a + (Number(i.summa)||0), 0);
      ch.push('<div class="gruppa"><div class="gruppa-shapka"><span>' + ekran(g.nazvanie) +
        '</span><span class="chislo">' + dengi(summa) + '</span></div>' +
        (g.stroki||[]).map(i=>
          '<div class="stroka"><span class="nazv">' + ekran(i.nazvanie) + '</span>' +
          '<span class="chislo">' + chislo(i.kolvo) + ' ' + ekran(i.edinica) + '</span>' +
          '<span class="chislo">× ' + dengi(i.cena) + '</span>' +
          '<span class="summa">' + dengi(i.summa) + '</span></div>'
        ).join('') + '</div>');
    });
  }

  // ----- сколько заплачено -----
  const opl = d.payments || [];
  const poluch = opl.reduce((a,o)=> a + (Number(o.amount_kop)||0), 0) / 100;
  const itog = Number(sn.itog) || 0;
  if(gruppy.length){
    const ost = itog - poluch;
    ch.push('<div class="itogi">');
    ch.push('<div class="itog"><span>Стоимость работ</span><b>' + dengi(itog) + '</b></div>');
    if(opl.length) ch.push('<div class="itog"><span>Получено</span><b>' + dengi(poluch) + '</b></div>');
    ch.push('<div class="itog itog-glavnyy"><span>' + (ost < 0 ? 'Переплата' : 'Остаток к оплате') +
      '</span><b>' + dengi(Math.abs(ost)) + '</b></div>');
    ch.push('</div>');
  }

  if(opl.length){
    ch.push('<h2>Оплаты</h2>');
    ch.push(opl.map(o=>
      '<div class="stroka"><span class="nazv">' + ekran(o.note || 'оплата') + '</span>' +
      '<span class="chislo">' + ekran(data(o.paid_on)) + '</span>' +
      '<span class="summa">' + dengi((Number(o.amount_kop)||0)/100) + '</span></div>'
    ).join(''));
  }

  // ----- материалы -----
  const mat = sn.materialy || [];
  if(mat.length){
    ch.push('<h2>Материалы</h2>');
    ch.push('<div class="zametka" style="margin-bottom:10px;">Покупает заказчик. В стоимость работ не входят, цены не указаны — они свои в каждом магазине.</div>');
    ch.push(mat.map(m=>
      '<div class="stroka"><span class="nazv">' + ekran(m.nazvanie) +
      (m.pometka ? ' <span class="chislo">· ' + ekran(m.pometka) + '</span>' : '') + '</span>' +
      '<span class="summa">' + chislo(m.kolvo) + ' ' + ekran(m.edinica) + '</span></div>'
    ).join(''));
  }

  // ----- снимки -----
  // Пока не показываем: обработчик подписи адресов отвергает посетителя
  // без учётной записи, и картинки просто не загрузились бы. Молчать
  // об этом хуже, чем сказать: заказчик, которому обещали снимки,
  // иначе решит, что страница сломалась.
  const foto = d.photos || [];
  if(foto.length){
    ch.push('<h2>Фотографии</h2>');
    ch.push('<div class="zametka">Снимков на объекте: ' + foto.length +
      '. Показ по ссылке пока готовится — попросите прислать их сообщением.</div>');
  }

  ch.push('<div class="podval">Смета составлена в приложении «СМЕТА | РАСЧЁТ». ' +
    'Это копия на день, указанный вверху: если работы менялись позже, попросите прислать ссылку заново.</div>');

  document.getElementById('koren').innerHTML = ch.join('');
  document.title = (p.name ? p.name + ' — ' : '') + 'Смета';
}

otkryt();
</script>
</body>
</html>
