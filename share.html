<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Смета — СМЕТА | РАСЧЁТ</title>

<!-- Страницу заказчика поисковикам отдавать не надо: за каждой ссылкой
     стоят чужие деньги и чужой объект. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="icon-192.png">
<link href="https://api.smetaraschet.ru/static/fonts.css" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://api.smetaraschet.ru/static/fonts.css" rel="stylesheet"></noscript>

<style>
  /* Вид взят из приложения: те же цвета, та же строка позиции.
     Правило «одинаковое по смыслу — одинаково и на вид» относится
     и к странице заказчика — он в тот же день может увидеть и её,
     и присланный PDF. */
  :root{
    --paper:#F6F3EC; --paper-line:#D9D2BE; --ink:#1E2A32; --ink-soft:#5B6B74;
    --white:#FFFDF9; --orange:#E8622C; --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#191C1F; --paper-line:#333A40; --ink:#E8E6E1;
           --ink-soft:#9AA5AC; --white:#111417; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0 16px 48px;
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.5;
  }
  .obertka{max-width:820px;margin:0 auto;}
  header{padding:28px 0 18px;}
  h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:26px;margin:0 0 4px;line-height:1.2;}
  .podpis{color:var(--ink-soft);font-size:13px;}
  h2{font-family:'Space Grotesk','Inter',sans-serif;font-size:18px;margin:28px 0 10px;}
  .gruppa{margin-bottom:18px;}
  .gruppa-shapka{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--paper-line);
    font-size:12px;font-weight:600;color:var(--ink-soft);
  }
  .stroka{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 10px;margin-bottom:6px;
    border:1px solid var(--paper-line);border-radius:var(--radius);
    background:var(--paper);font-size:13px;
  }
  .nazv{flex:1 1 180px;min-width:0;}
  .chislo{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);
    white-space:nowrap;}
  .summa{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);white-space:nowrap;}
  .itogi{margin-top:18px;padding-top:12px;border-top:1px solid var(--paper-line);
    display:flex;flex-direction:column;gap:6px;max-width:440px;}
  .itog{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    font-size:14px;color:var(--ink-soft);}
  .itog b{font-family:'JetBrains Mono',monospace;color:var(--ink);}
  .itog-glavnyy{font-weight:600;color:var(--ink);font-size:15px;}
  .itog-glavnyy b{color:var(--orange);font-size:18px;}
  .karta{border:1px solid var(--paper-line);border-radius:var(--radius);
    background:var(--white);padding:14px 16px;margin-bottom:14px;}
  .karta div{margin:2px 0;}
  .zametka{color:var(--ink-soft);font-size:13px;line-height:1.55;}
  .beda{
    max-width:520px;margin:64px auto;padding:22px 24px;text-align:center;
    border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--white);
  }
  .beda h1{font-size:20px;margin-bottom:8px;}
  .podval{margin-top:36px;padding-top:16px;border-top:1px solid var(--paper-line);
    color:var(--ink-soft);font-size:12px;line-height:1.6;}
  .plitki{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .plitka{position:relative;aspect-ratio:1;border:1px solid var(--paper-line);
    border-radius:var(--radius);overflow:hidden;background:var(--white);cursor:zoom-in;}
  .plitka img{width:100%;height:100%;object-fit:cover;display:block;}
  /* Подложка под ещё не пришедшей картинкой: плитка не мигает пустотой
     и видно, что здесь что-то будет. */
  .plitka img:not([src]), .plitka img[src=""]{background:var(--paper-line);}
  .plitka{background:color-mix(in srgb, var(--paper-line) 45%, transparent);}
  .plitka .zhdyom{display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--ink-soft);font-size:11px;}
  /* Просмотр на весь экран — лентой с перелистыванием, как в приложении.
     Владелец 2 сентября 2026: «фото должно быть лентой с перелистыванием».

     ЛЕНТУ ДЕЛАЕМ РОДНОЙ ПРОКРУТКОЙ С ПРИЛИПАНИЕМ, а не переносим сюда
     механику приложения. Там лента живёт на transform и ручном разборе
     касаний, потому что несёт на себе зум, комментарии и переключение
     между уменьшенной копией и полным снимком — на странице заказчика
     нет ничего из этого. Родная прокрутка даёт тот же жест и ту же
     инерцию, но без математики, которую пришлось бы чинить отдельно
     и в которой уже сидела ошибка (её правили 27 августа 2026). */
  .bolshoe{display:none;position:fixed;top:0;right:0;bottom:0;left:0;
    z-index:50;background:rgba(0,0,0,.94);}
  .bolshoe.on{display:block;}
  .bolshoe-lenta{position:absolute;top:0;right:0;bottom:0;left:0;
    display:flex;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    /* Не пускать прокрутку наружу: без этой строки палец, дойдя
       до края ленты, начинает тянуть страницу под ней. Владелец
       2 сентября 2026: «провожу пальцем и снизу фото скроллится
       страница». Вторая половина решения — замок на body, см. JS. */
    overscroll-behavior:contain;
    scrollbar-width:none;}
  .bolshoe-lenta::-webkit-scrollbar{display:none;}
  .bolshoe-kadr{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;
    display:flex;align-items:center;justify-content:center;
    padding:16px;box-sizing:border-box;}
  .bolshoe-kadr img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
  .bolshoe-kadr .zhdyom{color:rgba(255,255,255,.5);font-size:12px;}
  .bolshoe-zakryt{position:absolute;top:12px;right:12px;width:44px;height:44px;
    border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
    font-size:20px;cursor:pointer;line-height:1;z-index:2;}
  /* Какой снимок из скольких. Без счётчика в ленте не видно, сколько
     ещё осталось, и человек не знает, докрутил он до конца или нет. */
  .bolshoe-schet{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    z-index:2;color:#fff;font-size:12px;letter-spacing:.04em;
    background:rgba(0,0,0,.5);padding:5px 12px;border-radius:20px;}
  .bolshoe-strelka{position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border:none;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;
    cursor:pointer;z-index:2;}
  .bolshoe-strelka.vlevo{left:12px;}
  .bolshoe-strelka.vpravo{right:12px;}
  /* На узком экране стрелок нет: там листают пальцем, а кнопки
     только закрывают собой снимок. */
  @media (max-width:700px){ .bolshoe-strelka{display:none;} }
</style>
</head>
<body>
<div class="obertka" id="koren">
  <div class="zametka" style="padding:64px 0;text-align:center;">Открываем смету…</div>
</div>

<script>
// ---------- СТРАНИЦА ЗАКАЗЧИКА ----------
//
// Открывается по ссылке, без входа. Ничего не считает: смета приходит
// СНИМКОМ, посчитанным приложением той же арифметикой, которой печатается
// PDF. Второго способа считать деньги здесь нет и быть не должно —
// иначе он однажды разойдётся с первым, и разойдётся в деньгах.
//
// Ключ ниже публичный: он и так лежит в открытом index.html. Сам по себе
// он не даёт ничего — всё решает токен ссылки.
const ADRES = 'https://api.smetaraschet.ru';
const KLYUCH = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg0NDU4MzIyLCJleHAiOjIwOTk4MTgzMjJ9.YyClmZI9ZYHS6Tw7N5-WaxqcrEskgHTb2v5hM9MyO0Q';

function ekran(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function dengi(v){
  const n = Number(v) || 0;
  return n.toLocaleString('ru-RU', { maximumFractionDigits:0 }) + ' ₽';
}
function chislo(v){
  const n = Number(v);
  if(!isFinite(n)) return '';
  return n.toLocaleString('ru-RU', { maximumFractionDigits:3 });
}
function data(v){
  if(!v) return '';
  const d = new Date(v);
  return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
}

function beda(zagolovok, poyasnenie){
  document.getElementById('koren').innerHTML =
    '<div class="beda"><h1>' + ekran(zagolovok) + '</h1>' +
    '<div class="zametka">' + ekran(poyasnenie) + '</div></div>';
}

async function otkryt(){
  const token = new URLSearchParams(location.search).get('s');
  if(!token){
    beda('Ссылка неполная', 'Похоже, адрес скопирован не целиком. Попросите прислать ссылку заново.');
    return;
  }
  let otvet;
  try{
    const r = await fetch(ADRES + '/rest/v1/rpc/share_payload', {
      method:'POST',
      headers:{ 'apikey':KLYUCH, 'Authorization':'Bearer ' + KLYUCH,
                'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if(!r.ok) throw new Error('код ' + r.status);
    otvet = await r.json();
  }catch(e){
    console.error(e);
    beda('Не удалось открыть', 'Проверьте связь и обновите страницу. Если не поможет — попросите прислать ссылку заново.');
    return;
  }
  if(!otvet || !otvet.ok){
    beda('Ссылка не работает', (otvet && otvet.error) || 'Возможно, срок вышел или её отозвали.');
    return;
  }
  narisovat(otvet);
}

function narisovat(d){
  const p = d.project || {};
  const sn = d.estimate || {};
  const ch = [];

  ch.push('<header><h1>' + ekran(p.name || 'Смета') + '</h1>' +
    '<div class="podpis">' + (sn.sozdan ? 'смета от ' + ekran(data(sn.sozdan)) : '') + '</div></header>');

  // ----- заказчик, если разрешено -----
  const c = d.customer;
  if(c){
    const stroki = [];
    if(c.fio)     stroki.push(ekran(c.fio));
    if(c.address) stroki.push(ekran(c.address));
    if(c.phone)   stroki.push(ekran(c.phone));
    if(c.email)   stroki.push(ekran(c.email));
    if(c.contract_no) stroki.push('Договор № ' + ekran(c.contract_no) +
      (c.contract_date ? ' от ' + ekran(data(c.contract_date)) : ''));
    if(stroki.length) ch.push('<div class="karta">' + stroki.map(x=>'<div>'+x+'</div>').join('') + '</div>');
  }

  // ----- смета -----
  const gruppy = sn.gruppy || [];
  if(gruppy.length){
    ch.push('<h2>Смета</h2>');
    gruppy.forEach(g=>{
      const summa = (g.stroki||[]).reduce((a,i)=> a + (Number(i.summa)||0), 0);
      ch.push('<div class="gruppa"><div class="gruppa-shapka"><span>' + ekran(g.nazvanie) +
        '</span><span class="chislo">' + dengi(summa) + '</span></div>' +
        (g.stroki||[]).map(i=>
          '<div class="stroka"><span class="nazv">' + ekran(i.nazvanie) + '</span>' +
          '<span class="chislo">' + chislo(i.kolvo) + ' ' + ekran(i.edinica) + '</span>' +
          '<span class="chislo">× ' + dengi(i.cena) + '</span>' +
          '<span class="summa">' + dengi(i.summa) + '</span></div>'
        ).join('') + '</div>');
    });
  }

  // ----- сколько заплачено -----
  const opl = d.payments || [];
  const poluch = opl.reduce((a,o)=> a + (Number(o.amount_kop)||0), 0) / 100;
  const itog = Number(sn.itog) || 0;
  if(gruppy.length){
    const ost = itog - poluch;
    ch.push('<div class="itogi">');
    ch.push('<div class="itog"><span>Стоимость работ</span><b>' + dengi(itog) + '</b></div>');
    if(opl.length) ch.push('<div class="itog"><span>Получено</span><b>' + dengi(poluch) + '</b></div>');
    ch.push('<div class="itog itog-glavnyy"><span>' + (ost < 0 ? 'Переплата' : 'Остаток к оплате') +
      '</span><b>' + dengi(Math.abs(ost)) + '</b></div>');
    ch.push('</div>');
  }

  if(opl.length){
    ch.push('<h2>Оплаты</h2>');
    ch.push(opl.map(o=>
      '<div class="stroka"><span class="nazv">' + ekran(o.note || 'оплата') + '</span>' +
      '<span class="chislo">' + ekran(data(o.paid_on)) + '</span>' +
      '<span class="summa">' + dengi((Number(o.amount_kop)||0)/100) + '</span></div>'
    ).join(''));
  }

  // ----- материалы -----
  const mat = sn.materialy || [];
  if(mat.length){
    ch.push('<h2>Материалы</h2>');
    ch.push('<div class="zametka" style="margin-bottom:10px;">Покупает заказчик. В стоимость работ не входят, цены не указаны — они свои в каждом магазине.</div>');
    ch.push(mat.map(m=>
      '<div class="stroka"><span class="nazv">' + ekran(m.nazvanie) +
      (m.pometka ? ' <span class="chislo">· ' + ekran(m.pometka) + '</span>' : '') + '</span>' +
      '<span class="summa">' + chislo(m.kolvo) + ' ' + ekran(m.edinica) + '</span></div>'
    ).join(''));
  }

  // ----- снимки -----
  // Адреса подписываются обработчиком по токену ссылки: хранилище
  // закрытое, прямых адресов у снимков нет. Просим их после отрисовки,
  // пачками, чтобы страница показалась сразу, а не ждала картинок.
  const foto = d.photos || [];
  // Порядок снимков нужен ленте: она листает по нему, а не по тому,
  // в каком порядке пришли подписанные адреса.
  fotoPoryadok = foto.map(f=> f.id);
  if(foto.length){
    ch.push('<h2>Фотографии</h2>');
    ch.push('<div class="plitki">' + foto.map(f=>
      '<div class="plitka" data-foto="' + ekran(f.id) + '"><div class="zhdyom">…</div></div>'
    ).join('') + '</div>');
  }

  ch.push('<div class="podval">Смета составлена в приложении «СМЕТА | РАСЧЁТ». ' +
    'Это копия на день, указанный вверху: если работы менялись позже, попросите прислать ссылку заново.</div>');

  document.getElementById('koren').innerHTML = ch.join('');
  document.title = (p.name ? p.name + ' — ' : '') + 'Смета';
  if(foto.length) podgruzitFoto(foto.map(f=>f.id));
}

// Адреса снимков просим пачками по 50: столько же берёт приложение,
// и обработчик на большее не рассчитан.
async function podgruzitFoto(ids){
  const token = new URLSearchParams(location.search).get('s');
  for(let i = 0; i < ids.length; i += 50){
    const kusok = ids.slice(i, i + 50);
    // Просим ДВА набора адресов: уменьшенные копии и полные.
    // Копии есть не у всех — снимки старше 2 сентября 2026 их не имеют,
    // и хранилище отвечает на них 404. Полный держим наготове, чтобы
    // подставить его картинке по ошибке загрузки, а не ходить за ним
    // потом и заставлять человека ждать второй раз.
    // Оба запроса — только подписи, файлы не качаются.
    const sprosit = async (razmer)=>{
      try{
        const telo = { action:'view', share_token:token, attachment_ids:kusok };
        if(razmer) telo.size = razmer;
        const r = await fetch(ADRES + '/functions/v1/photo-url', {
          method:'POST',
          headers:{ 'apikey':KLYUCH, 'Authorization':'Bearer ' + KLYUCH,
                    'Content-Type':'application/json' },
          body: JSON.stringify(telo)
        });
        const d = await r.json();
        return (d && d.links) || {};
      }catch(e){ console.error('Снимки не пришли', e); return {}; }
    };
    const [mini, polnye] = await Promise.all([ sprosit('m'), sprosit(null) ]);
    const links = polnye;

    kusok.forEach(id=>{
      const kl = document.querySelector('[data-foto="' + CSS.escape(id) + '"]');
      if(!kl) return;
      const u = links[id];
      // Не пришёл адрес — не оставляем пустую плитку с многоточием
      // навсегда: человек не должен гадать, грузится оно или сломалось.
      if(!u){ kl.innerHTML = '<div class="zhdyom">нет снимка</div>'; return; }

      // КАРТИНКУ ВСТАВЛЯЕМ В СТРАНИЦУ СРАЗУ, А НЕ ПОСЛЕ ЗАГРУЗКИ.
      //
      // Сперва было наоборот: адрес ставился картинке, которой ещё нет
      // на странице, и она попадала в неё только по onload. Признак
      // «грузить лениво» при этом не работает вовсе — он смотрит,
      // где элемент на экране, а элемента на экране нет. Браузер брался
      // качать все снимки разом: двадцать семь штук по 440 КБ забивали
      // связь друг другу, и первый появлялся через минуту.
      // Владелец 1 сентября 2026: «фото оооооочень долго загружаются».
      //
      // Теперь картинка стоит в странице с самого начала, и браузер сам
      // качает только то, что близко к видимой части. Уменьшенных копий
      // у снимков нет — хранится один размер, — поэтому лень это
      // единственное, чем можно помочь.
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = '';
      // Плитке хватает копии. Её нет — хранилище ответит 404, и мы один
      // раз подставим полный. Второй отказ значит, что дело не в размере.
      let vzyaliPolnyy = !mini[id];
      img.onerror = ()=>{
        if(!vzyaliPolnyy){ vzyaliPolnyy = true; img.src = u; return; }
        kl.innerHTML = '<div class="zhdyom">нет снимка</div>';
      };
      kl.innerHTML = '';
      kl.appendChild(img);
      img.src = mini[id] || u;
      // На весь экран — всегда полный: там его и смотрят.
      fotoAdresa[id] = u;
      kl.onclick = ()=> pokazatBolshoe(id);
    });
  }
}

// ---------- ПРОСМОТР СНИМКОВ ЛЕНТОЙ ----------
let fotoPoryadok = [];      // номера снимков по порядку страницы
const fotoAdresa = {};      // номер -> полный адрес
let kadrSeychas = 0;
let prokrutkaDo = 0;

// ЗАМОК СТРАНИЦЫ.
// Владелец 2 сентября 2026: «провожу пальцем и снизу фото скроллится
// страница». Одного overflow:hidden на body мало — на iOS страница
// всё равно тянется. Работает только приём с position:fixed, но он
// сбрасывает прокрутку в ноль, поэтому её надо запомнить и вернуть,
// иначе закрыв снимок человек окажется в начале сметы.
function zamokStranicy(vkl){
  const b = document.body;
  if(vkl){
    prokrutkaDo = window.scrollY || window.pageYOffset || 0;
    b.style.position = 'fixed';
    b.style.top = (-prokrutkaDo) + 'px';
    b.style.left = '0';
    b.style.right = '0';
    b.style.width = '100%';
  } else {
    b.style.position = ''; b.style.top = '';
    b.style.left = ''; b.style.right = ''; b.style.width = '';
    window.scrollTo(0, prokrutkaDo);
  }
}

function bolshoeSobrat(){
  let b = document.getElementById('bolshoe');
  if(b) return b;
  b = document.createElement('div');
  b.id = 'bolshoe';
  b.className = 'bolshoe';
  b.innerHTML =
      '<div class="bolshoe-lenta" id="bolshoeLenta">'
    + fotoPoryadok.map(id=>
        '<div class="bolshoe-kadr" data-kadr="' + ekran(id) + '">'
        + '<div class="zhdyom">…</div></div>').join('')
    + '</div>'
    + '<div class="bolshoe-schet" id="bolshoeSchet"></div>'
    + '<button class="bolshoe-strelka vlevo" aria-label="Предыдущий">‹</button>'
    + '<button class="bolshoe-strelka vpravo" aria-label="Следующий">›</button>'
    + '<button class="bolshoe-zakryt" aria-label="Закрыть">✕</button>';
  document.body.appendChild(b);

  const lenta = b.querySelector('#bolshoeLenta');

  // КУДА ДОЕХАЛИ — СПРАШИВАЕМ У ЛЕНТЫ, А НЕ ЖДЁМ ОДНОГО СОБЫТИЯ.
  //
  // Сначала здесь стоял только слушатель scroll. Проверка 2 сентября
  // 2026 показала, что полагаться на него нельзя: лента уезжала
  // (scrollLeft менялся с 0 на 2480), а событие не приходило ни разу —
  // счётчик так и держал «1 / 4». Один источник правды о положении
  // ленты оказался источником, который иногда молчит.
  //
  // Теперь пересчёт зовут все, кто может сдвинуть ленту:
  //  — scroll, где он есть;
  //  — scrollend, где он есть (приходит, когда прилипание уже доехало);
  //  — конец касания и колесо мыши — на случай, если молчат оба первых.
  // Пересчёт дешёвый и идемпотентный: если кадр тот же, он ничего
  // не делает.
  ['scroll','scrollend'].forEach(imya=>
    lenta.addEventListener(imya, kadrPereschitat, { passive:true }));
  ['pointerup','touchend','wheel'].forEach(imya=>
    lenta.addEventListener(imya, ()=> setTimeout(kadrPereschitat, 120),
                           { passive:true }));

  b.querySelector('.vlevo').onclick  = ()=> listat(-1);
  b.querySelector('.vpravo').onclick = ()=> listat(1);
  b.querySelector('.bolshoe-zakryt').onclick = zakrytBolshoe;

  // ЗАКРЫТИЕ ЩЕЛЧКОМ ПО ПОДЛОЖКЕ — но только если палец не ехал.
  // Без этой проверки лента закрывалась бы в конце каждого пролистывания:
  // браузер иногда доводит смахивание до обычного щелчка.
  let nachalo = null;
  lenta.addEventListener('pointerdown', e=>{ nachalo = { x:e.clientX, y:e.clientY }; });
  lenta.addEventListener('click', e=>{
    if(e.target.tagName === 'IMG') return;         // по самому снимку не закрываем
    if(nachalo && Math.abs(e.clientX - nachalo.x) > 10) return;
    zakrytBolshoe();
  });

  document.addEventListener('keydown', e=>{
    if(!b.classList.contains('on')) return;
    if(e.key === 'Escape'){ zakrytBolshoe(); return; }
    if(e.key === 'ArrowLeft')  listat(-1);
    if(e.key === 'ArrowRight') listat(1);
  });

  // Повернули устройство — ширина кадра другая, и лента встала бы
  // между снимками. Возвращаем её на текущий кадр.
  window.addEventListener('resize', ()=>{
    if(!b.classList.contains('on')) return;
    lentaK(kadrSeychas);
  });

  return b;
}

// ЕДИНСТВЕННОЕ МЕСТО, КОТОРОЕ ДВИГАЕТ ЛЕНТУ.
//
// БЕЗ ПЛАВНОСТИ, И ЭТО НЕ ЛЕНЬ. Проверено 2 сентября 2026 в настоящем
// браузере, на четырёх снимках: при scroll-snap-type: x mandatory лента
// не двигается ни от scrollTo({behavior:'smooth'}), ни от присваивания
// scrollLeft при style.scrollBehavior = 'smooth'. Счётчик оставался
// на «1 / 4» после пяти нажатий стрелки подряд. То же присваивание
// без плавности отрабатывает сразу и точно.
//
// Прилипание и плавная прокрутка спорят друг с другом, и спорят
// по-разному в разных браузерах. Выбор между «красиво, но иногда
// не листает» и «просто листает» тут очевиден.
//
// Пальцем при этом всё плавно: смахивание ведёт РОДНАЯ прокрутка
// со своей инерцией, эта функция в нём не участвует вовсе. Стрелки —
// только для мыши, там мгновенная смена кадра привычна.
function lentaK(i){
  const l = document.getElementById('bolshoeLenta');
  if(!l) return;
  l.scrollLeft = i * l.clientWidth;
  // Своё же движение отмечаем сами, не дожидаясь события: его может
  // и не прийти (см. выше). Палец по-прежнему считается пересчётом.
  kadrSeychas = i;
  kadryObnovit();
}

// Прочитать положение ленты и, если кадр сменился, обновить показ.
function kadrPereschitat(){
  const l = document.getElementById('bolshoeLenta');
  if(!l || !l.clientWidth) return;
  const i = Math.min(Math.max(0, Math.round(l.scrollLeft / l.clientWidth)),
                     fotoPoryadok.length - 1);
  if(i !== kadrSeychas){ kadrSeychas = i; kadryObnovit(); }
}

function listat(kuda){
  const i = Math.min(Math.max(0, kadrSeychas + kuda), fotoPoryadok.length - 1);
  lentaK(i);
}

// Грузим только текущий снимок и по одному соседу с каждой стороны.
// Остальным адрес снимаем: полные файлы тяжёлые, и держать в памяти
// все двадцать семь незачем — при возврате они подставятся снова.
function kadryObnovit(){
  const schet = document.getElementById('bolshoeSchet');
  if(schet) schet.textContent = (kadrSeychas + 1) + ' / ' + fotoPoryadok.length;

  // Стрелку у края убираем совсем. Серая неработающая кнопка заставляет
  // гадать, сломалось оно или снимки кончились.
  const vl = document.querySelector('.bolshoe-strelka.vlevo');
  const vp = document.querySelector('.bolshoe-strelka.vpravo');
  if(vl) vl.style.display = kadrSeychas > 0 ? '' : 'none';
  if(vp) vp.style.display = kadrSeychas < fotoPoryadok.length - 1 ? '' : 'none';

  fotoPoryadok.forEach((id, i)=>{
    const kadr = document.querySelector('[data-kadr="' + CSS.escape(id) + '"]');
    if(!kadr) return;
    const nuzhen = Math.abs(i - kadrSeychas) <= 1;
    const u = fotoAdresa[id];
    if(!nuzhen){
      if(kadr.firstChild && kadr.firstChild.tagName === 'IMG'){
        kadr.innerHTML = '<div class="zhdyom">…</div>';
      }
      return;
    }
    if(!u){ kadr.innerHTML = '<div class="zhdyom">нет снимка</div>'; return; }
    let img = kadr.querySelector('img');
    if(!img){
      img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      img.onerror = ()=>{ kadr.innerHTML = '<div class="zhdyom">нет снимка</div>'; };
      kadr.innerHTML = '';
      kadr.appendChild(img);
      img.src = u;
    }
  });
}

function pokazatBolshoe(id){
  const i = fotoPoryadok.indexOf(id);
  if(i < 0) return;
  const b = bolshoeSobrat();
  b.classList.add('on');
  zamokStranicy(true);
  // Ширина кадра известна только после показа — до него она нулевая,
  // и лента уехала бы в начало. lentaK сам поставит номер и перерисует.
  lentaK(i);
}

function zakrytBolshoe(){
  const b = document.getElementById('bolshoe');
  if(!b || !b.classList.contains('on')) return;
  b.classList.remove('on');
  zamokStranicy(false);
}

otkryt();
</script>
</body>
</html>
